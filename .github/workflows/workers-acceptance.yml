name: Built Workers browser acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      WORKERS_BROWSER_REPORT: "test-results/workers-browser.json"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - run: node scripts/check-d1-schema.mjs
      - name: Synthetic recovery rehearsal
        run: |
          mkdir -p test-results
          pnpm test:workers-recovery > test-results/workers-recovery-synthetic.log
          cat test-results/workers-recovery-synthetic.log
      - run: pnpm build:vinext
      - run: pnpm test:workers-durability
      - run: pnpm test:workers-browser
        env:
          WORKERS_BROWSER_OUTPUT: ${{ runner.temp }}/productos-workers-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-workers-browser-result
          path: |
            test-results/workers-browser.json
            test-results/workers-recovery-synthetic.log
          retention-days: 7
