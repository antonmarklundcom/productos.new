name: CI

# Minutos de Actions (NEW-STORE.md § "CI y minutos de Actions"). Este archivo
# viaja a TODAS las tiendas, y el costo depende de si el repo es público o
# privado: en un repo **público** los runners estándar de GitHub son gratis y
# sin límite; en uno **privado** cada minuto se descuenta de la cuenta. Por eso
# cada job mira `github.event.repository.private`:
#
#   - Público: todo corre en cada PR y en cada push a main (e2e incluido;
#     lighthouse en cada push a main). No cuesta nada y es la red que ataja lo
#     que un PR de piel rompe en checkout.
#   - Privado: sólo PRs (el push a main no corre: ya corrió en su PR), `checks`
#     siempre, `e2e` sólo con el label `ci-completo`, a mano, o en un PR de
#     distribución del template (rama `template/…`); `lighthouse` sólo a mano.
#   - En los dos: un PR que sólo toca docs no corre nada (`paths-ignore`), y
#     un push nuevo cancela la corrida anterior (`concurrency`). Poner el label
#     `ci-completo` dispara la corrida sola (`labeled`); cualquier otro label no.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**.md"
      - "fable/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "fable/**"
      - "LICENSE"
  workflow_dispatch:

# Un label que no es `ci-completo` va a su propio grupo: si compartiera el
# del PR, cancelaría la corrida de verdad (`opened`) y quedaría sólo su job
# salteado. Pasa siempre con Dependabot, que etiqueta el PR apenas lo abre.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci-completo' && format('-label-{0}', github.event.label.name) || '' }}
  cancel-in-progress: true

jobs:
  checks:
    # Un push a main en un repo privado no corre (ya corrió en su PR), y un
    # label que no es `ci-completo` no dispara nada. Un job salteado no cuesta
    # minutos.
    if: >-
      (github.event_name != 'push' || !github.event.repository.private) &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci-completo')
    runs-on: ubuntu-latest
    # Un paso que se cuelga no puede comerse el runner (ni los logs, que
    # recién quedan disponibles cuando el job termina).
    timeout-minutes: 15

    # Los tests de dominio (transitionOrder, reservas, contador de pedidos)
    # corren contra MySQL de verdad: FOR UPDATE y las transacciones no se
    # pueden simular con un mock.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ecom
          MYSQL_USER: ecom
          MYSQL_PASSWORD: ecom
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/ecom
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/ecom_test
      SESSION_SECRET: ci-session-secret-de-al-menos-32-caracteres
      # Sin esto, `next build` avisa que no puede resolver la URL absoluta de
      # la imagen de Open Graph y cae en localhost. En la tienda real lo
      # bloquea `pnpm preflight`; acá alcanza con un dominio de mentira, que
      # es justamente lo que el código se niega a inventar por su cuenta
      # (ver src/lib/site-url.ts).
      NEXT_PUBLIC_SITE_URL: https://ci.example.py

    steps:
      - uses: actions/checkout@v7

      # Sin `version:` a propósito: sale de "packageManager" en package.json,
      # y declarar las dos hace fallar la action.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # MySQL con una hora que no es UTC, como un servidor con `time_zone =
      # SYSTEM` (Hostinger). El pool fija cada sesión en UTC (src/db/index.ts);
      # si eso se rompe, los tests de reservas de stock fallan acá y no en
      # producción.
      - name: MySQL fuera de UTC
        run: mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL time_zone = '-03:00'"

      # `POST /api/setup/init` deploya **migraciones**, no `schema.ts`: en el
      # servidor no hay drizzle-kit y `db:push` no corre. O sea que una columna
      # agregada a schema.ts sin su migración generada compila, pasa los tests
      # (que también migran) y recién falla en producción, con la tienda arriba
      # y la columna faltando. Acá se ve en el PR.
      #
      # El dev local sigue usando `pnpm db:push`; lo que se pide es que la
      # migración esté generada y commiteada.
      - name: schema.ts no se despegó de las migraciones
        run: |
          set -euo pipefail

          pnpm db:generate

          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::schema.ts cambió sin su migración. Corré \`pnpm db:generate\` y commiteá lo que aparezca en drizzle/."
            git status --porcelain drizzle
            git --no-pager diff -- drizzle
            exit 1
          fi

          echo "✓ schema.ts y drizzle/ están al día"

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test
        timeout-minutes: 8

      - run: pnpm build

  # Playwright contra un build de verdad (fable/plan.md §6.1): lo que ve la
  # compradora en un navegador, no lo que asume un test unitario. Corre
  # después de `checks` — sin typecheck/lint/unitarios verdes no vale la pena
  # pagar el minuto extra de un navegador.
  #
  # Es el job más caro (navegador + build + base sembrada): en un repo privado
  # no corre en cada PR, ver el comentario de arriba de todo para cómo pedirlo.
  e2e:
    needs: checks
    if: >-
      !github.event.repository.private ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci-completo') ||
      startsWith(github.head_ref, 'template/')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ecom_test
          MYSQL_USER: ecom
          MYSQL_PASSWORD: ecom
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/ecom_test
      SESSION_SECRET: ci-session-secret-de-al-menos-32-caracteres
      NEXT_PUBLIC_SITE_URL: https://ci.example.py
      CRON_SECRET: ci-cron-secret-de-16-caracteres
      WHATSAPP_NUMBER: "+595981123456"
      # `compra.spec.ts` no necesita tarjeta ni credenciales de Cloud: el
      # checkout de invitado con transferencia alcanza. `panel.spec.ts` sí
      # necesita loguearse, por eso el dueño se crea con estas dos.
      OWNER_EMAIL: owner@ci.example.py
      OWNER_PASSWORD: "Contrasena-Segura-Para-CI-123"
      OWNER_NAME: "Dueño CI"
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/ecom_test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `db:push`, no migraciones: acá no hay nada previo que preservar y es
      # el mismo camino que ya usa `checks` (implícito, al correr los tests
      # de integración) — más simple que armar el POST a `/api/setup/init`
      # contra un server que todavía no arrancó (fable/plan.md §6.1 deja
      # elegir entre las dos).
      - run: pnpm db:push
      - run: pnpm exec tsx scripts/prepare-browser-tests.ts

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build

      - run: pnpm exec playwright test
        timeout-minutes: 10

      # Las capturas (`capturas.spec.ts`, plan-operacion §6.4) son para mirar
      # cómo quedó la pantalla en este PR, no para diagnosticar un fallo —
      # así que suben siempre. El reporte completo de Playwright (traces,
      # video de los tests que fallaron) sigue subiendo sólo en fallo: es
      # pesado y sólo hace falta para debuguear.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capturas
          path: playwright-report/capturas/
          retention-days: 14
          if-no-files-found: ignore

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Lighthouse contra el mismo `next start` que ya usa `e2e` (plan-operacion
  # §6.4). Corre después de `e2e` — no tiene sentido pagar el minuto extra
  # si el build ya no levanta. `continue-on-error: true` a propósito: la
  # varianza del runner compartido de GitHub Actions es demasiada para que
  # un número de performance bloquee un PR — el número que sí bloquea es el
  # presupuesto de JS de `tests/e2e/presupuesto.spec.ts` (arriba, en `e2e`),
  # medido con bytes reales, no con un puntaje que cambia con la carga del
  # runner. Este job es sólo una alarma temprana.
  # En un repo público corre en cada push a main (gratis); en uno privado,
  # sólo a mano: es una alarma sin poder de bloqueo y no vale los minutos.
  lighthouse:
    needs: e2e
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !github.event.repository.private)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ecom
          MYSQL_USER: ecom
          MYSQL_PASSWORD: ecom
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/ecom
      SESSION_SECRET: ci-session-secret-de-al-menos-32-caracteres
      NEXT_PUBLIC_SITE_URL: https://ci.example.py
      CRON_SECRET: ci-cron-secret-de-16-caracteres
      WHATSAPP_NUMBER: "+595981123456"
      OWNER_EMAIL: owner@ci.example.py
      OWNER_PASSWORD: "Contrasena-Segura-Para-CI-123"
      OWNER_NAME: "Dueño CI"

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:push
      - run: pnpm db:seed
      - run: pnpm create-owner

      - run: pnpm build

      # Un producto del seed, por slug — el mismo criterio de `compra.spec.ts`
      # (fable/plan.md §6.1): no hardcodear el catálogo de una tienda
      # concreta, salvo que `scripts/seed-data.ts` (que sí es fijo, a
      # diferencia del catálogo real de una tienda) ya lo garantice. Ese
      # archivo siempre trae un producto con este slug.
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          urls: |
            http://127.0.0.1:3000/
            http://127.0.0.1:3000/producto/auriculares-bluetooth-tws
            http://127.0.0.1:3000/checkout
          uploadArtifacts: true
          temporaryPublicStorage: false
          runs: 1
          startServerCommand: pnpm start
          startServerReadyPattern: "Ready in"
          startServerReadyTimeout: 30000
          configPath: ./.lighthouserc.json
